name: Test and build Android prototype
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HYDRO_TOOLS: ${{ github.workspace }}/.tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified Godot and Android tools
        run: python3 scripts/setup.py --android
      - name: Import project
        run: ./scripts/godot.sh --headless --editor --import
      - name: Physics, phase changes, controls and lifecycle
        run: ./scripts/godot.sh --headless --script res://tests/run.gd
      - name: Water volume, optical depth and independent reservoir controls
        run: |
          ./scripts/godot.sh --headless --script res://tests/water_optics.gd
          ./scripts/godot.sh --headless --script res://tests/final_input.gd
          ./scripts/godot.sh --headless --script res://tests/geometry_index.gd
          ./scripts/godot.sh --headless --script res://tests/final_precision.gd
      - name: Render-frame scheduling avoids catch-up reconstruction
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ./scripts/godot.sh --audio-driver Dummy --script res://tests/render_schedule.gd
      - name: Complete final course with the original water
        run: ./scripts/godot.sh --headless --script res://tests/final_course.gd
      - name: New levels through sensor input
        run: ./scripts/godot.sh --headless --script res://tests/advanced_input.gd -- tilt
      - name: New levels through rotation controls
        run: ./scripts/godot.sh --headless --script res://tests/advanced_input.gd -- rotation
      - name: Build and verify debug APK
        run: ./scripts/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hydrologic-android-debug
          path: build/hydrologic-0.16.1-android.apk
