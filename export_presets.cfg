[preset.0]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt,assets/GODOT-*.txt"
exclude_filter="tests/*,docs/*,scripts/*,.github/*,build/*,native/src/*,native/SConstruct,native/build_profile.json"
export_path="build/hydrologic-0.11.0-android.apk"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=11
version/name="0.11.0"
package/unique_name="com.zakgovin.hydrologic"
package/name="Гидрологика"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
launcher_icons/main_192x192="res://assets/icon.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icon_adaptive.png"
launcher_icons/adaptive_background_432x432="res://assets/icon_bg.svg"
launcher_icons/adaptive_monochrome_432x432="res://assets/icon_monochrome.svg"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false
permissions/vibrate=false
user_data_backup/allow=false
apk_expansion/enable=false
command_line/extra_args=""
graphics/opengl_debug=false

